<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Private preview</title>
<meta name="description" content="Private preview. A password is required.">
<style>
  :root { --bg:#FFFFFF; --ink:#33322E; --mute:#928D84; --line:#E7E2D9; --gold:#B08D4C; --bad:#9A3B2E; }
  @media (prefers-color-scheme: dark) { :root { --bg:#191815; --ink:#ECE8DF; --mute:#9C968B; --line:#35322C; --gold:#C6A566; --bad:#E08A7B; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.5 -apple-system, "Helvetica Neue", Arial, sans-serif;
         display: grid; place-items: center; padding: 24px 16px; }
  form { width: 100%; max-width: 340px; }
  .eyebrow { font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--mute); margin: 0 0 14px; }
  h1 { font-weight: 300; font-size: 30px; line-height: 1.15; margin: 0; }
  .rule { width: 44px; height: 1px; background: var(--gold); margin: 20px 0 28px; }
  label { display: block; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--mute); margin-bottom: 8px; }
  input { width: 100%; font: inherit; color: var(--ink); background: transparent; border: 0; border-bottom: 1px solid var(--line);
          padding: 8px 0; border-radius: 0; outline: none; }
  input:focus { border-bottom-color: var(--gold); }
  button { margin-top: 24px; width: 100%; font: inherit; font-size: 12px; letter-spacing: .2em; text-transform: uppercase;
           color: var(--bg); background: var(--ink); border: 0; padding: 14px; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  button[disabled] { opacity: .6; cursor: default; }
  #msg { min-height: 22px; margin: 14px 0 0; font-size: 14px; color: var(--bad); }
</style>
</head>
<body>

  <div class="rule"></div>
  <label for="pw">Password</label>
  <input id="pw" type="password" autofocus autocapitalize="none" spellcheck="false" required>
  <button id="go" type="submit">Enter</button>
  <p id="msg" role="alert"></p>
</form>

<script>
(function () {
  var form = document.getElementById('gate'), pw = document.getElementById('pw'),
      go = document.getElementById('go'), msg = document.getElementById('msg');
  function bytes(b) { var s = atob(b), a = new Uint8Array(s.length); for (var k = 0; k < s.length; k++) a[k] = s.charCodeAt(k); return a; }
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (!window.crypto || !crypto.subtle) { msg.textContent = 'This browser cannot open the preview. Try a current Safari or Chrome.'; return; }
    var p = JSON.parse(document.getElementById('payload').textContent);
    go.disabled = true; msg.textContent = '';
    crypto.subtle.importKey('raw', new TextEncoder().encode(pw.value.trim().toLowerCase()), 'PBKDF2', false, ['deriveKey'])
      .then(function (m) {
        return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bytes(p.s), iterations: p.n, hash: 'SHA-256' }, m,
          { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      })
      .then(function (k) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(p.i) }, k, bytes(p.c)); })
      .then(function (buf) {
        var html = new TextDecoder().decode(buf);
        document.open(); document.write(html); document.close();
      })
      .catch(function () { go.disabled = false; msg.textContent = 'That password is not right.'; pw.select(); });
  });
})();
</script>
