      /* Link-in-bio layout on top of existing site tokens.
         Override global styles.css `header { position:fixed }` which otherwise
         pins .links-identity and overlaps the cards while scrolling on iPhone. */
      html, body { overflow-x: clip; max-width: 100%; }
      .links-page {
        box-sizing: border-box;
        max-width: 560px;
        width: 100%;
        margin: 0 auto;
        padding: max(24px, env(safe-area-inset-top, 0px))
                 max(16px, env(safe-area-inset-right, 0px))
                 max(48px, env(safe-area-inset-bottom, 0px))
                 max(16px, env(safe-area-inset-left, 0px));
        min-width: 0;
      }
      .links-page *, .links-page *::before, .links-page *::after { box-sizing: border-box; }
      .links-page header.links-identity,
      .links-page .links-identity {
        position: static !important;
        top: auto !important;
        left: auto !important;
        right: auto !important;
        bottom: auto !important;
        inset: auto !important;
        z-index: auto !important;
        background: transparent !important;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
        border-bottom: 0 !important;
        box-shadow: none !important;
        contain: none !important;
        text-align: center;
        margin: 0 0 28px;
        width: 100%;
        max-width: 100%;
        min-width: 0;
      }
      .links-page .links-identity img {
        width: 88px; height: 88px; border-radius: 50%; object-fit: cover;
        border: 2px solid var(--gray-200); margin: 0 auto 14px; display: block;
      }
      .links-page h1 {
        font-size: clamp(22px, 5vw, 32px); margin: 0 0 6px;
        overflow-wrap: anywhere; word-break: break-word; min-width: 0;
      }
      .links-page .links-tag {
        color: var(--gray-600); font-size: 0.95rem; margin: 0 auto; max-width: 36em;
        line-height: 1.45; overflow-wrap: anywhere; word-break: break-word; min-width: 0;
      }
      .links-page .links-cta {
        display: flex; align-items: center; justify-content: center; text-align: center;
        text-decoration: none; background: var(--accent); color: var(--white); font-weight: 600;
        padding: 14px 18px; border-radius: 12px; margin: 0 0 28px;
        box-shadow: var(--shadow-accent); min-height: 44px; min-width: 0;
        overflow-wrap: anywhere; word-break: break-word;
      }
      .links-page .links-cta:hover { background: var(--accent-hover); }
      .links-page h2 {
        font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase;
        color: var(--gray-500); margin: 28px 0 10px; font-weight: 600;
        overflow-wrap: anywhere; min-width: 0;
      }
      .links-page .links-stack {
        display: flex; flex-direction: column; gap: 10px;
        width: 100%; max-width: 100%; min-width: 0;
      }
      .links-page a.links-card {
        display: block; text-decoration: none; color: var(--gray-900);
        background: var(--white); border: 1px solid var(--gray-200);
        border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow-sm);
        transition: border-color var(--duration-base) var(--ease-out),
                    box-shadow var(--duration-base) var(--ease-out);
        min-height: 44px; min-width: 0; max-width: 100%;
        overflow-wrap: anywhere; word-break: break-word;
      }
      .links-page a.links-card:hover {
        border-color: var(--accent); box-shadow: var(--shadow-md);
      }
      .links-page a.links-card strong {
        display: block; font-size: 1rem; font-weight: 600;
        overflow-wrap: anywhere; word-break: break-word; min-width: 0;
      }
      .links-page a.links-card small {
